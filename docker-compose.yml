# Example compose file for the lying RPC.
# Not a production manifest; for the Devcon workshop one container is enough.
#
#   docker compose up --build
#
# then point the workshop app at http://localhost:8545/plain (etc.).

services:
  lying-rpc:
    build: .
    ports:
      - "8545:8545"
    environment:
      # Must serve eth_getProof for the chain head reliably. Load-balanced
      # public endpoints may lag behind (see README); prefer your own node.
      UPSTREAM_RPC: https://eth.drpc.org
    restart: unless-stopped
